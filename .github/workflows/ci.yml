name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      DATABASE_URL: postgresql://cullinari_app:app@localhost:5432/cullinari
      MIGRATE_DATABASE_URL: postgresql://cullinari_owner:owner@localhost:5432/cullinari
      JWT_SECRET: ci-secret-ci-secret-ci-secret-0123456789
      DATA_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      STAFF_API_KEY: ci-staff-key
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cullinari/shared build
      - run: bash scripts/db-setup.sh
      - run: pnpm db:migrate
      - run: SEED_DEMO=false pnpm db:seed
      - run: pnpm --filter @cullinari/api typecheck
      - run: pnpm --filter @cullinari/api test
      - run: pnpm --filter @cullinari/admin build
